# Publishes the app to GitHub Pages every time the main branch changes, and once a day.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Pubblica

on:
  push:
    branches: [main]
  # Every morning, after Cardmarket has published the day's price list: the prices of the sealed
  # products are read again and the site is published with them.
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a publication already under way is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Sealed products and their prices, from Cardmarket's public files, written to
      # public/data/sealed.json. If Cardmarket cannot be reached the file already online is kept.
      - name: Prodotti sigillati
        run: PREVIOUS_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/sealed.json" node scripts/build-sealed.mjs
      # A trial of CardTrader as the source of prices by language and condition: it asks a few dozen
      # questions and writes what comes back (numbers and field names only: no sellers, no account
      # data) to public/data/cardtrader-*.json. It does nothing until the repository has the secret
      # CARDTRADER_TOKEN (Settings → Secrets and variables → Actions), and it never stops a publication.
      - name: Prova di CardTrader
        continue-on-error: true
        timeout-minutes: 8
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: node scripts/cardtrader-probe.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Asks the real catalogue for a few cards and checks the answers have the shape the app expects.
  # It does not block publishing: it is there to say early if the data source changes.
  fonti:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tests/live.mjs
